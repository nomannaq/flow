[package]
name = "runtime"
description = "Flow sessions, ACP integration and workspace ownership"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
url.workspace = true
mime_guess.workspace = true
context.workspace = true
base64.workspace = true
genai.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
agent-client-protocol.workspace = true
history.workspace = true
ignore.workspace = true
getrandom.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std", "net", "sync", "time", "rt", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
winapi-util = "0.1.11"

[dev-dependencies]
blake3.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
