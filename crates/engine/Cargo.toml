[package]
name = "engine"
description = "Flow's local Rust engine executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "flow-engine"
path = "src/main.rs"

[[test]]
name = "bootstrap"
path = "../../tests/integration/bootstrap.rs"

[[test]]
name = "agent_sessions"
path = "../../tests/integration/agent_sessions.rs"

[dependencies]
futures-util.workspace = true
getrandom.workspace = true
history.workspace = true
protocol.workspace = true
runtime.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
url.workspace = true
tempfile.workspace = true

[lints]
workspace = true
