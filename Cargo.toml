[workspace]
members = ["crates/protocol", "crates/runtime", "crates/history", "crates/engine", "crates/context"]
default-members = ["crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
url = "2.5"
mime_guess = "2.0"
protocol = { path = "crates/protocol" }
runtime = { path = "crates/runtime" }
history = { path = "crates/history" }
context = { path = "crates/context" }
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-php = "=0.25.1"
tree-sitter-r = "=1.3.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-scala = "=0.26.3"
tree-sitter-elixir = "=0.3.5"
tree-sitter-solidity = "=1.2.13"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-dart = "=0.3.0"
tree-sitter-clojure = { package = "tree-sitter-clojure-orchard", version = "=0.2.8" }
tree-sitter-nix = "=0.3.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-gleam = "=1.0.0"
streaming-iterator = "0.1"
regex = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
genai = { version = "=0.6.5", default-features = false, features = ["rustls-tls"] }

agent-client-protocol = { version = "3.3.0", default-features = false, features = ["process"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4.3"
blake3 = "1.8.7"
base64 = "=0.22.1"
ignore = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
