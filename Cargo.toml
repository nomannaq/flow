[workspace]
members = ["crates/protocol", "crates/runtime", "crates/history", "crates/engine"]
default-members = ["crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
runtime = { path = "crates/runtime" }
history = { path = "crates/history" }

agent-client-protocol = { version = "3.3.0", default-features = false, features = ["process"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4.3"
blake3 = "1.8.7"
ignore = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
