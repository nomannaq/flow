name: Native plugin packages

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Set only after the repository owner reviews the exact bundled IDE terms.
      FLOW_IDE_TERMS_SHA256: ${{ vars.FLOW_IDE_TERMS_SHA256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Windows native tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build unchanged previous release for real upgrade acceptance
        run: python scripts/build_upgrade_baseline.py --output integrations/jetbrains/build/upgrade-baseline
      - name: Run B26 integrity and B29 packaged acceptance
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/check_release_acceptance.py --desktop --upgrade-from integrations/jetbrains/build/upgrade-baseline/*-${{ matrix.target }}.zip --output integrations/jetbrains/build/release-acceptance/evidence.json
          else
            python scripts/check_release_acceptance.py --desktop --upgrade-from integrations/jetbrains/build/upgrade-baseline/*-${{ matrix.target }}.zip --output integrations/jetbrains/build/release-acceptance/evidence.json
          fi
      - name: Retain platform package after native acceptance
        uses: actions/upload-artifact@v4
        with:
          name: flow-jetbrains-${{ matrix.target }}
          path: integrations/jetbrains/build/distributions/*-${{ matrix.target }}.zip
          if-no-files-found: error
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-checks-${{ matrix.target }}
          path: |
            integrations/jetbrains/build/release-acceptance/
            integrations/jetbrains/build/desktop-acceptance/
            integrations/jetbrains/build/upgrade-baseline/baseline.json
            integrations/jetbrains/build/reports/
            integrations/jetbrains/build/test-results/
            integrations/jetbrains/build/native-engine/distribution.json
            integrations/jetbrains/build/native-engine/dependency-inventory.json
          if-no-files-found: ignore
